<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flurp</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3b3a;--bg2:#145250;--blob:#ff7eb6;--blob2:#ffb3d5;--bit:#d8ff5e;--zap:#2a1747;--zapline:#b78bff;--ink:#f4fff6;--muted:#9fd6c9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2d2c;--bg2:#103f3d}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;height:100%}
canvas{display:block;width:100%;height:100%;cursor:none}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-size:22px;font-weight:700;pointer-events:none}
#hud small{color:var(--muted);font-weight:500;font-size:14px;display:block}
#lives{letter-spacing:4px;color:var(--blob)}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(10,40,38,.78)}
#panel.hide{display:none}
h1{font-size:clamp(64px,18vw,120px);margin:0;line-height:1;color:var(--blob);font-weight:700;transform:rotate(-3deg)}
p{max-width:30ch;line-height:1.45;color:var(--ink);margin:14px 0 22px;font-size:18px}
button{font:inherit;font-weight:700;font-size:22px;padding:12px 34px;border:0;border-radius:40px;background:var(--bit);color:#1b2a00;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#best{margin-top:16px;color:var(--muted);font-size:16px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" aria-label="Flurp game"></canvas>
<div id="hud"><div><small>Score</small><span id="score">0</span></div><div id="lives"></div><div style="text-align:right"><small>Best</small><span id="bestHud">0</span></div></div>
<div id="panel">
<h1 id="title">Flurp</h1>
<p id="msg">Slurp the green bits to grow. Dodge the purple spikes. Move with your mouse, finger or arrow keys.</p>
<button id="go">Play</button>
<div id="best"></div>
</div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,dpr;
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();
var css=getComputedStyle(document.documentElement);
function v(n){return css.getPropertyValue(n).trim()}
var best=0;try{best=+localStorage.getItem('flurp-best')||0}catch(e){}
var $=function(id){return document.getElementById(id)};
var state='menu',score,lives,blob,bits,zaps,t,spawnT,hurt,keys={},target={x:0,y:0},popups;
function showBest(){$('bestHud').textContent=best;$('best').textContent=best?'Best: '+best:''}
showBest();
function reset(){score=0;lives=3;t=0;spawnT=0;hurt=0;bits=[];zaps=[];popups=[];
blob={x:W/2,y:H/2,vx:0,vy:0,r:26,wob:0};target.x=W/2;target.y=H/2;
for(var i=0;i<8;i++)addBit();updateHud()}
function updateHud(){$('score').textContent=score;$('lives').textContent=Array(Math.max(lives,0)+1).join('●')}
function edgePos(){var s=Math.floor(Math.random()*4),m=30;
if(s==0)return{x:-m,y:Math.random()*H,a:0};if(s==1)return{x:W+m,y:Math.random()*H,a:Math.PI};
if(s==2)return{x:Math.random()*W,y:-m,a:Math.PI/2};return{x:Math.random()*W,y:H+m,a:-Math.PI/2}}
function addBit(){var p=edgePos(),sp=30+Math.random()*50,a=p.a+(Math.random()-.5);
bits.push({x:Math.random()*W,y:Math.random()*H,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5+Math.random()*5,ph:Math.random()*6})}
function addZap(){var p=edgePos(),sp=60+Math.min(score,300)*.4+Math.random()*40,a=p.a+(Math.random()-.5)*.8;
zaps.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:14+Math.random()*10,rot:0})}
function start(){reset();state='play';$('panel').classList.add('hide')}
function end(){state='over';if(score>best){best=score;try{localStorage.setItem('flurp-best',best)}catch(e){}}
showBest();$('title').textContent='Splat';
$('msg').textContent='You slurped '+score+' points'+(score&&score>=best?' — a new best!':'.');
$('go').textContent='Play again';$('panel').classList.remove('hide');$('go').focus()}
$('go').onclick=start;
function setT(e){var r=cv.getBoundingClientRect();target.x=e.clientX-r.left;target.y=e.clientY-r.top}
cv.addEventListener('pointermove',setT);cv.addEventListener('pointerdown',setT);
window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key.indexOf('Arrow')==0)e.preventDefault()});
window.addEventListener('keyup',function(e){keys[e.key]=false});
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function pop(x,y,s,c){popups.push({x:x,y:y,s:s,c:c,life:1})}
var last=performance.now();
function loop(now){var dt=Math.min((now-last)/1000,.05);last=now;
if(state=='play')update(dt);draw(dt);requestAnimationFrame(loop)}
function update(dt){t+=dt;
var kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ky=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
if(kx||ky){target.x=blob.x+kx*120;target.y=blob.y+ky*120}
var k=5;blob.vx+=(target.x-blob.x)*k*dt;blob.vy+=(target.y-blob.y)*k*dt;
blob.vx*=Math.pow(.02,dt);blob.vy*=Math.pow(.02,dt);
blob.x+=blob.vx*dt*2.2;blob.y+=blob.vy*dt*2.2;
blob.x=Math.max(blob.r,Math.min(W-blob.r,blob.x));blob.y=Math.max(blob.r,Math.min(H-blob.r,blob.y));
blob.wob+=dt*8;hurt=Math.max(0,hurt-dt);
spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.6,2.2-score/120);if(zaps.length<4+score/40)addZap()}
bits.forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt;b.ph+=dt*3;
if(b.x<-20)b.x=W+20;if(b.x>W+20)b.x=-20;if(b.y<-20)b.y=H+20;if(b.y>H+20)b.y=-20});
for(var i=bits.length-1;i>=0;i--){var b=bits[i];
if(dist(b,blob)<blob.r+b.r){bits.splice(i,1);score+=10;blob.r=Math.min(blob.r+.9,Math.min(W,H)/5);
pop(b.x,b.y,'+10',v('--bit'));updateHud();addBit()}}
for(var j=zaps.length-1;j>=0;j--){var z=zaps[j];z.x+=z.vx*dt;z.y+=z.vy*dt;z.rot+=dt*2;
if(z.x<-60||z.x>W+60||z.y<-60||z.y>H+60){zaps.splice(j,1);continue}
if(!hurt&&dist(z,blob)<blob.r*.85+z.r*.8){hurt=1.2;lives--;blob.r=Math.max(20,blob.r*.8);
pop(blob.x,blob.y-blob.r,'Ouch',v('--zapline'));updateHud();zaps.splice(j,1);if(lives<=0){end();return}}}
for(var p=popups.length-1;p>=0;p--){popups[p].life-=dt*1.4;popups[p].y-=30*dt;if(popups[p].life<=0)popups.splice(p,1)}}
function draw(){
var g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
g.addColorStop(0,v('--bg2'));g.addColorStop(1,v('--bg'));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
if(!blob){blob={x:W/2,y:H/2,r:40,wob:0,vx:0,vy:0};bits=[];zaps=[];popups=[];hurt=0}
bits.forEach(function(b){var s=1+Math.sin(b.ph)*.2;ctx.fillStyle=v('--bit');ctx.beginPath();ctx.arc(b.x,b.y,b.r*s,0,6.3);ctx.fill();
ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(b.x,b.y,b.r*s*1.9,0,6.3);ctx.fill();ctx.globalAlpha=1});
zaps.forEach(function(z){ctx.save();ctx.translate(z.x,z.y);ctx.rotate(z.rot);ctx.fillStyle=v('--zap');ctx.strokeStyle=v('--zapline');ctx.lineWidth=2.5;
ctx.beginPath();for(var i=0;i<16;i++){var r=i%2?z.r*.6:z.r*1.2,a=i/16*6.283;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()});
if(state!='menu'||true){drawBlob()}
popups.forEach(function(p){ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.font='700 20px Fredoka, sans-serif';ctx.textAlign='center';ctx.fillText(p.s,p.x,p.y);ctx.globalAlpha=1})}
function drawBlob(){
if(state=='menu'){blob.x=W/2;blob.y=H*.72;blob.wob+=.05}
var sp=Math.hypot(blob.vx,blob.vy),stretch=1+Math.min(sp/500,.25),ang=Math.atan2(blob.vy,blob.vx);
if(hurt>0&&Math.floor(hurt*14)%2)ctx.globalAlpha=.4;
ctx.save();ctx.translate(blob.x,blob.y);ctx.rotate(ang);ctx.scale(stretch,1/stretch);
ctx.beginPath();for(var i=0;i<=40;i++){var a=i/40*6.2832,r=blob.r*(1+.06*Math.sin(a*3+blob.wob)+.04*Math.sin(a*5-blob.wob*1.3));
var x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
ctx.closePath();var gr=ctx.createRadialGradient(-blob.r*.3,-blob.r*.3,blob.r*.1,0,0,blob.r);
gr.addColorStop(0,v('--blob2'));gr.addColorStop(1,v('--blob'));ctx.fillStyle=gr;ctx.fill();ctx.restore();
ctx.save();ctx.translate(blob.x,blob.y);var ex=Math.cos(ang)*blob.r*.12,ey=Math.sin(ang)*blob.r*.12;
[-1,1].forEach(function(s){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*blob.r*.3+ex,-blob.r*.1+ey,blob.r*.18,0,6.3);ctx.fill();
ctx.fillStyle='#2a1747';ctx.beginPath();ctx.arc(s*blob.r*.3+ex*2.2,-blob.r*.1+ey*2.2,blob.r*.08,0,6.3);ctx.fill()});
ctx.strokeStyle='#2a1747';ctx.lineWidth=Math.max(2,blob.r*.06);ctx.lineCap='round';ctx.beginPath();
ctx.arc(ex,blob.r*.2+ey,blob.r*.16,.15,3,false);ctx.stroke();ctx.restore();ctx.globalAlpha=1}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flurp ふるーぷ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#ffd3e4;--sky2:#fff1dc;--sun:#ff6f8e;--fuji:#b9b3e6;--snow:#fff;--blob:#ffe6ee;--blob2:#ffffff;--gold:#ffc83a;--ink:#5a3560;--muted:#9a6b9f;--ninja:#3d3a78;--band:#ff4f6d;--petal:#ffb0cb;--panel:rgba(255,241,247,.86);--btn:#ff4f6d;--btntxt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#3b2b63;--sky2:#8a4f86;--sun:#ff8fa8;--fuji:#5d4f94;--snow:#e9defa;--ink:#ffeaf4;--muted:#e3b4d6;--panel:rgba(48,30,76,.86);--petal:#ff9fc0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--sky1);color:var(--ink);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Trebuchet MS',sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;height:100%}
canvas{display:block;width:100%;height:100%;cursor:none}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-size:24px;font-weight:700;pointer-events:none}
#hud small{color:var(--muted);font-weight:500;font-size:14px;display:block}
#lives{letter-spacing:3px;color:var(--band);font-size:26px}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--panel)}

h1{font-size:clamp(64px,18vw,120px);margin:0;line-height:1;color:var(--band);font-weight:700;transform:rotate(-3deg)}
#kana{font-size:22px;color:var(--muted);margin:6px 0 0;letter-spacing:.3em}
p{max-width:30ch;line-height:1.5;margin:14px 0 22px;font-size:18px}
button{font:inherit;font-weight:700;font-size:22px;padding:12px 38px;border:0;border-radius:40px;background:var(--btn);color:var(--btntxt);cursor:pointer;box-shadow:0 5px 0 rgba(90,53,96,.28)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(90,53,96,.28)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#best{margin-top:16px;color:var(--muted);font-size:16px}
#mute{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:5;width:46px;height:46px;padding:0;font-size:22px;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:0 3px 0 rgba(90,53,96,.25)}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" aria-label="Flurp game"></canvas>
<div id="hud"><div><small>Score</small><span id="score">0</span></div><div id="lives"></div><div style="text-align:right"><small>Best</small><span id="bestHud">0</span></div></div>
<button id="mute" aria-label="Toggle sound">🔊</button>
<div id="panel">
<h1 id="title">Flurp</h1>
<div id="kana">ふるーぷ</div>
<p id="msg">Flurp is a hungry little mochi! Collect toppings to grow big and round, and dodge ninjas, crows and oni. Catch the pink mochi to heal a heart, and grab glowing orbs for power-ups. Fill the bar at the bottom to level up! Move with your mouse, finger or arrow keys.</p>
<button id="go">Play</button>
<div id="best"></div>
</div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,dpr,FONT="'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif";
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();
var css=getComputedStyle(document.documentElement);
function v(n){return css.getPropertyValue(n).trim()}
var best=0;try{best=+localStorage.getItem('flurp-best')||0}catch(e){}
var $=function(id){return document.getElementById(id)};
var state='menu',score=0,lives=3,blob,bits=[],zaps=[],popups=[],t=0,spawnT=0,hurt=0,keys={},target={x:0,y:0},petals=[];
var eat=0,eatKind='happy',combo=0,comboT=0,blinkT=1;
var KINDS={berry:{pts:10,g:.9,c:'#ff4f6d'},dango:{pts:25,g:1.8,c:'#3f9a5a'},star:{pts:50,g:3,c:'#e8a800'}};
function pickKind(){var r=Math.random();return r<.68?'berry':r<.92?'dango':'star'}
var pink=null,pinkT=10;
var pw=null,pwT=18,god=0,gun=0,fireT=0,shots=[],puffs=[],fast=false;
var MOB=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
var clones=[],cloneT=0,big=0,bigF=1,slow=0,magnet=0,novaN=0,novaT=0,CLC=['#d8f3ff','#fff1b8','#d8ffd8'];
var puddles=[];
var PTYPES=['god','gun','clone','mega','nova','slow','magnet'];
var PN={god:['God mode!','#e8a800'],gun:['Mochi shot!','#ff4f6d'],clone:['Kage bunshin!','#2f9fd8'],mega:['Mega mochi!','#8a55e0'],nova:['Mochi nova!','#e8741f'],slow:['Sakura time!','#1fa88a'],magnet:['Magnet!','#e04444']};
var PCOL={clone:'#2f9fd8',mega:'#8a55e0',nova:'#e8741f',slow:'#1fa88a',magnet:'#e04444'};
var POOLS=[['ninja'],['ninja','shuriken'],['ninja','shuriken','crow','nunchaku','bomb'],['ninja','shuriken','nunchaku','mask','sesame','bomb'],['ninja','crow','katana','mask','sesame','nunchaku','bomb'],['ninja','shuriken','crow','katana','mask','nunchaku','sesame','bomb']];
function pickEnemy(){var p=POOLS[Math.min(lvl,6)-1],t=p[Math.floor(Math.random()*p.length)];if(lvl>=4&&Math.random()<.1&&!zaps.some(function(q){return q.t=='oni'}))return 'oni';if((t=='bomb'||t=='sesame')&&zaps.filter(function(q){return q.t==t}).length>=2)return 'ninja';return t}
function givePower(t,x,y){pop(x,y,PN[t][0],PN[t][1]);
if(t=='god')god=8;else if(t=='gun')gun=10;else if(t=='slow')slow=6;else if(t=='magnet')magnet=10;
else if(t=='clone'){clones=[];for(var i=0;i<3;i++)clones.push({x:blob.x,y:blob.y,a:i*2.094,col:CLC[i]});cloneT=14}
else if(t=='mega'){if(big<=0){bigF=Math.max(1,Math.min(1.8,(Math.min(W,H)/3.2)/blob.r));blob.r*=bigF}big=8}
else if(t=='nova'){novaN=3;novaT=0}}
var lvl=1,banner=null,grace=0,LV=[0,100,250,450,700,1000];
var THEMES=[{name:'Fuji Sunrise'},
{name:'Sakura Temple',c:{'--sky1':'#ffb3c9','--sky2':'#ffd9a8','--sun':'#ff7a59','--fuji':'#9a8fd0','--snow':'#ffffff','--petal':'#ffb0cb'}},
{name:'Bamboo Grove',c:{'--sky1':'#c9f0d0','--sky2':'#f2ffe0','--sun':'#fff3a0','--fuji':'#7fc79a','--snow':'#f4fff4','--petal':'#7fcf8f','--ink':'#2f4d3e','--muted':'#5b8f78'}},
{name:'Sushi Bar',c:{'--sky1':'#f4c28a','--sky2':'#fde9cf','--sun':'#fff3c4','--fuji':'#c98a52','--snow':'#ffffff','--petal':'#ffd36b','--ink':'#3b1f1a','--muted':'#8a5b44'}},
{name:'Snowy Village',c:{'--sky1':'#bfe3ff','--sky2':'#f3fbff','--sun':'#ffd1dc','--fuji':'#8fb5e6','--snow':'#ffffff','--petal':'#8fc4f0','--ink':'#33406b','--muted':'#6577a8'}},
{name:'Golden Pavilion',c:{'--sky1':'#ffc9a8','--sky2':'#fff2e6','--sun':'#ff4f4f','--fuji':'#e59a86','--snow':'#fff8f0','--petal':'#ff9a76'}}];
var LIGHT={'--ink':'#5a3560','--muted':'#9a6b9f','--panel':'rgba(255,241,247,.86)'};
var TKEYS=['--sky1','--sky2','--sun','--fuji','--snow','--petal','--ink','--muted','--ninja','--panel'];
function thIdx(n){return n<=6?n-1:1+((n-7)%5)}
function levelFor(s){if(s>=1000)return 6+Math.floor((s-1000)/300);for(var i=LV.length-1;i>=0;i--)if(s>=LV[i])return i+1;return 1}
function setTheme(i){var r=document.documentElement.style,k;TKEYS.forEach(function(x){r.removeProperty(x)});var c=THEMES[i].c;if(c){for(k in LIGHT)r.setProperty(k,LIGHT[k]);for(k in c)r.setProperty(k,c[k])}}
function levelUp(n){lvl=n;var ti=thIdx(n);setTheme(ti);banner={t:0,a:'Level '+n,b:THEMES[ti].name};
zaps.forEach(function(z){puffs.push({x:z.x,y:z.y,t:0,r:z.r})});zaps=[];shots=[];
lives=Math.min(5,lives+1);updateHud();grace=2.4;spawnT=2.8;sfx('level')}
for(var i=0;i<22;i++)petals.push({x:Math.random(),y:Math.random(),s:4+Math.random()*5,sp:18+Math.random()*25,ph:Math.random()*6});
function showBest(){$('bestHud').textContent=best;$('best').textContent=best?'Best: '+best:''}
showBest();
function reset(){score=0;lives=3;t=0;spawnT=0;hurt=0;bits=[];zaps=[];popups=[];pink=null;pinkT=10;pw=null;pwT=18;god=0;gun=0;fireT=0;shots=[];puffs=[];fast=false;lvl=1;banner=null;grace=0;setTheme(0);clones=[];cloneT=0;big=0;bigF=1;slow=0;magnet=0;novaN=0;novaT=0;puddles=[];
blob={x:W/2,y:H/2,vx:0,vy:0,r:26,wob:0};target.x=W/2;target.y=H/2;
for(var i=0;i<8;i++)addBit();updateHud()}
function updateHud(){$('score').textContent=score;$('lives').textContent=Array(Math.max(lives,0)+1).join('♥')}
function edgePos(){var s=Math.floor(Math.random()*4),m=40;
if(s==0)return{x:-m,y:Math.random()*H,a:0};if(s==1)return{x:W+m,y:Math.random()*H,a:Math.PI};
if(s==2)return{x:Math.random()*W,y:-m,a:Math.PI/2};return{x:Math.random()*W,y:H+m,a:-Math.PI/2}}
function addBit(){var a=Math.random()*6.28,sp=25+Math.random()*40;
bits.push({x:Math.random()*W,y:Math.random()*H,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:7+Math.random()*4,ph:Math.random()*6,kind:pickKind()})}
function addZap(){var p=edgePos(),sp=(55+Math.min(lvl,10)*14+Math.random()*40)*(MOB?.85:1),a=p.a+(Math.random()-.5)*.8;
var ty=pickEnemy(),rr=Math.random();
var z={t:ty,x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:17+Math.random()*7,ph:Math.random()*6,life:16};
if(ty=='shuriken'){var d=Math.atan2(blob.y-p.y,blob.x-p.x),s2=(150+Math.min(lvl,10)*10)*(MOB?.75:1);z.vx=Math.cos(d)*s2;z.vy=Math.sin(d)*s2;z.r=15}
if(ty=='crow'){z.vx=(p.x<W/2?1:-1)*(80+sp*.4);z.vy=(Math.random()-.5)*40;z.r=18}
if(ty=='oni'){z.r=34;z.vx=0;z.vy=0;z.hp=3;sfx('oni')}
if(ty=='mask'){z.r=24;z.mode=0;z.tm=1.2+Math.random();var ma=Math.atan2(blob.y-p.y,blob.x-p.x);z.vx=Math.cos(ma)*50;z.vy=Math.sin(ma)*50;z.life=14}
if(ty=='katana'){z.x=Math.max(40,Math.min(W-40,p.x));z.y=Math.max(40,Math.min(H-40,p.y));z.vx=0;z.vy=0;z.mode=0;z.tm=1.1;z.ang=0;z.r=20;sfx('glint')}
if(ty=='nunchaku'){z.r=22;var nga=Math.atan2(blob.y-p.y,blob.x-p.x),nsp=(125+lvl*8)*(MOB?.8:1);z.vx=Math.cos(nga)*nsp;z.vy=Math.sin(nga)*nsp;z.life=12}
if(ty=='sesame'){z.r=26;z.hp=2;z.life=20;z.vx=0;z.vy=0}
if(ty=='bomb'){var bx=0,by=0;for(var tr=0;tr<14;tr++){bx=60+Math.random()*(W-120);by=60+Math.random()*(H-120);if(Math.hypot(bx-blob.x,by-blob.y)>blob.r+150)break}z.x=bx;z.y=by;z.vx=0;z.vy=0;z.r=18;z.fuse=4.5;sfx('glint')}
zaps.push(z)}
function start(){reset();state='play';$('panel').classList.add('hide');audioInit();musicStart();sfx('start')}
function end(){state='over';musicStop();sfx('over');if(score>best){best=score;try{localStorage.setItem('flurp-best',best)}catch(e){}}
showBest();$('title').textContent='Gyaa!';$('kana').textContent='ぎゃー！';
$('msg').textContent='Reached level '+lvl+'. You gobbled '+score+' points'+(score&&score>=best?' — a new best!':'.');
$('go').textContent='Play again';$('panel').classList.remove('hide');$('go').focus()}
$('go').onclick=start;
function setT(e){var r=cv.getBoundingClientRect();target.x=e.clientX-r.left;target.y=e.clientY-r.top}
cv.addEventListener('pointermove',setT);cv.addEventListener('pointerdown',setT);
window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key.indexOf('Arrow')==0)e.preventDefault()});
window.addEventListener('keyup',function(e){keys[e.key]=false});
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function pop(x,y,s,c){popups.push({x:x,y:y,s:s,c:c,life:1})}
var AC=null,master,musicGain,sfxGain,muted=false,timer=null,step=0,nextT=0,nb=null;
try{muted=localStorage.getItem('flurp-mute')=='1'}catch(e){}
function audioInit(){if(AC){if(AC.state=='suspended')AC.resume();return}
var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
AC=new C();master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
musicGain=AC.createGain();musicGain.gain.value=.32;musicGain.connect(master);
sfxGain=AC.createGain();sfxGain.gain.value=.6;sfxGain.connect(master)}
function mtof(n){return 440*Math.pow(2,(n-69)/12)}
function tone(f,t,d,type,vol,dest,slide){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
function hat(t,hp,dur,vol,ft){hp=hp||7000;dur=dur||.04;vol=vol||.06;if(!nb){var len=Math.floor(AC.sampleRate*.25);nb=AC.createBuffer(1,len,AC.sampleRate);var d=nb.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1}
var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;f.type=ft||'highpass';f.frequency.value=hp;
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(musicGain);s.start(t)}
var CH=[[41,[60,64,69,72]],[43,[59,62,65,67]],[40,[59,62,64,67]],[45,[60,64,67,69]]];
var MEL=[81,0,0,79,77,0,81,0,84,0,81,0,79,0,77,0].concat([79,0,0,77,74,0,77,0,79,0,83,0,81,0,79,0],[76,0,0,79,83,0,79,0,76,0,74,0,76,0,79,0],[81,0,0,84,81,0,79,0,76,0,79,0,81,0,0,0]);
var BASS=[0,-1,-1,12,-1,-1,0,-1,0,-1,-1,12,-1,-1,7,-1],STAB=[1,0,0,1,0,0,1,0,0,0,1,0,0,1,0,0];
function playStep(s,t,spb){var b=s>>4,k=s&15,c=CH[b];
if(k%4==0)tone(130,t,.14,'sine',.45,musicGain,45);
if(k==4||k==12)hat(t,1500,.12,.22,'bandpass');
if(k%4==2)hat(t,8000,.12,.07);else if(k&1)hat(t,9000,.03,.035);
var bo=BASS[k];if(bo>=0){var bn=mtof(c[0]+bo);tone(bn,t,.16,'triangle',.34,musicGain);tone(bn,t,.1,'square',.05,musicGain)}
if(STAB[k])c[1].forEach(function(n){tone(mtof(n),t,.24,'triangle',.07,musicGain);tone(mtof(n+12),t,.12,'sine',.03,musicGain)});
if(k==0)c[1].forEach(function(n){tone(mtof(n),t,1.6,'sine',.03,musicGain)});
var m=MEL[s];if(m){var d=spb*2.6;tone(mtof(m),t,d,'sawtooth',.06,musicGain);tone(mtof(m)*1.006,t,d,'square',.03,musicGain);tone(mtof(m+12),t,d*.6,'sine',.025,musicGain)}
if(fast){var an=c[1][(k>>1)%4]+12*((k>>3)&1);tone(mtof(an),t,spb*1.6,'square',.045,musicGain);
if(k%2==0)tone(mtof(c[0]+(k%4==0?0:12)),t,spb*1.5,'sawtooth',.1,musicGain);
if(k==4||k==12)tone(220,t,.1,'triangle',.2,musicGain,110);
if(k==14||k==15)hat(t,3000,.08,.18,'bandpass')}}
function sched(){if(!AC)return;var spb=60/(fast?158:118+Math.min(lvl,8)*3)/4;
while(nextT<AC.currentTime+.3){playStep(step,nextT,spb);nextT+=spb;step=(step+1)%64}}
function musicStart(){if(!AC)return;musicStop();step=0;nextT=AC.currentTime+.15;timer=setInterval(sched,80)}
function musicStop(){if(timer){clearInterval(timer);timer=null}}
function sfx(n){if(!AC||muted)return;var t=AC.currentTime,d=sfxGain;
if(n=='berry'){tone(700,t,.09,'sine',.35,d,1500);tone(1568,t+.07,.12,'sine',.22,d)}
else if(n=='dango'){[659,784,988,1319].forEach(function(f,i){tone(f*.9,t+i*.055,.12,'sine',.28,d,f)})}
else if(n=='star'){[1319,1568,1976,2349,2637].forEach(function(f,i){tone(f,t+i*.05,.25,'sine',.24,d);tone(f*2,t+i*.05,.12,'sine',.06,d)})}
else if(n=='heart'){[1047,1319,1568,2093,2637].forEach(function(f,i){tone(f,t+i*.06,.28,'triangle',.2,d)});tone(600,t,.18,'sine',.22,d,1800);tone(900,t+.18,.2,'sine',.18,d,2400)}
else if(n=='hurt'){tone(900,t,.12,'sine',.3,d,400);tone(500,t+.1,.2,'triangle',.22,d,250);tone(800,t+.22,.1,'sine',.18,d,350)}
else if(n=='over'){[784,659,523,392,330].forEach(function(f,i){tone(f,t+i*.16,.28,'sine',.28,d);tone(f*2,t+i*.16,.14,'sine',.06,d)})}
else if(n=='oni'){tone(160,t,.2,'triangle',.3,d,70);tone(160,t+.22,.2,'triangle',.3,d,70);tone(120,t+.44,.4,'sawtooth',.1,d,60)}
else if(n=='start'){[659,784,988,1319,1568].forEach(function(f,i){tone(f*.95,t+i*.06,.16,'sine',.26,d,f)})}
else if(n=='pinkspawn'){tone(1568,t,.25,'sine',.2,d);tone(2093,t+.12,.35,'sine',.16,d)}
else if(n=='heal'){[784,988,1175,1568,1976,2349].forEach(function(f,i){tone(f,t+i*.07,.3,'triangle',.22,d);tone(f*2,t+i*.07,.15,'sine',.05,d)});tone(500,t,.3,'sine',.2,d,1600)}
else if(n=='power'){[523,659,784,1047,1319,1568,2093].forEach(function(f,i){tone(f,t+i*.05,.2,'square',.1,d);tone(f*2,t+i*.05,.15,'sine',.12,d)})}
else if(n=='shoot'){tone(1000,t,.08,'sine',.22,d,1700)}
else if(n=='poof'){tone(1400,t,.14,'triangle',.26,d,300);tone(2000,t+.03,.1,'sine',.14,d,800)}
else if(n=='level'){[523,659,784,1047,784,1047,1319,1568].forEach(function(f,i){tone(f,t+i*.08,.22,'square',.12,d);tone(f*2,t+i*.08,.18,'sine',.1,d)})}
else if(n=='glint'){tone(2600,t,.18,'sine',.12,d,3400);tone(3300,t+.08,.2,'sine',.08,d)}
else if(n=='boom'){tone(140,t,.45,'sawtooth',.28,d,40);tone(400,t,.25,'square',.1,d,70);tone(90,t+.05,.5,'sine',.3,d,35)}}
function setMuteLabel(){var m=$('mute');m.textContent=muted?'🔇':'🔊';m.classList.toggle('off',muted)}
function toggleMute(){muted=!muted;try{localStorage.setItem('flurp-mute',muted?'1':'0')}catch(e){}if(master)master.gain.value=muted?0:.8;setMuteLabel()}
$('mute').onclick=function(){toggleMute();this.blur()};
window.addEventListener('keydown',function(e){if(e.key=='m'||e.key=='M')toggleMute()});
document.addEventListener('visibilitychange',function(){if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
setMuteLabel();
var last=performance.now();
function loop(now){var dt=Math.min((now-last)/1000,.05);last=now;

ctx.fillStyle='#fff1d6';ctx.beginPath();ctx.moveTo(-22,-20);ctx.lineTo(-14,-42);ctx.lineTo(-7,-26);ctx.moveTo(22,-20);ctx.lineTo(14,-42);ctx.lineTo(7,-26);ctx.fill();
ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.arc(0,0,34,0,6.3);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-12,-4,7,8,0,0,6.3);ctx.ellipse(12,-4,7,8,0,0,6.3);ctx.fill();
ctx.fillStyle='#3a2146';ctx.beginPath();ctx.arc(-11,-3,3.5,0,6.3);ctx.arc(11,-3,3.5,0,6.3);ctx.fill();
ctx.strokeStyle='#3a2146';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-22,-17);ctx.lineTo(-6,-10);ctx.moveTo(22,-17);ctx.lineTo(6,-10);ctx.stroke();
ctx.fillStyle='#3a2146';ctx.beginPath();ctx.ellipse(0,16,11,6,0,0,6.3);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-8,11);ctx.lineTo(-5,18);ctx.lineTo(-2,11);ctx.moveTo(8,11);ctx.lineTo(5,18);ctx.lineTo(2,11);ctx.fill();
ctx.fillStyle='rgba(255,215,225,.75)';ctx.beginPath();ctx.ellipse(-24,6,6,3.5,0,0,6.3);ctx.ellipse(24,6,6,3.5,0,0,6.3);ctx.fill();ctx.restore()}
function drawNinja(z){var s=z.r/20,dir=z.vx<0?-1:1,bob=Math.sin(z.ph)*2;
ctx.save();ctx.translate(z.x,z.y+bob);ctx.scale(s*dir,s);
var fl=Math.sin(z.ph*1.3)*5;ctx.fillStyle=v('--band');
ctx.beginPath();ctx.moveTo(-17,-8);ctx.quadraticCurveTo(-28,-14+fl,-38,-6+fl*1.3);ctx.lineTo(-30,-5+fl*.5);ctx.lineTo(-38,3+fl);ctx.quadraticCurveTo(-26,-1,-17,-4);ctx.fill();
ctx.fillStyle=v('--ninja');ctx.beginPath();ctx.ellipse(0,21,11,8,0,0,6.3);ctx.fill();
ctx.beginPath();ctx.arc(0,0,20,0,6.3);ctx.fill();
ctx.fillStyle='#ffe3d1';ctx.beginPath();ctx.ellipse(0,3,15,8.5,0,0,6.3);ctx.fill();
ctx.fillStyle=v('--band');ctx.fillRect(-18,-11,36,6);
ctx.fillStyle='#2b2250';ctx.beginPath();ctx.ellipse(-6,3,3,4,0,0,6.3);ctx.ellipse(6,3,3,4,0,0,6.3);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,1.8,1.2,0,6.3);ctx.arc(7,1.8,1.2,0,6.3);ctx.fill();
ctx.fillStyle='rgba(255,120,150,.6)';ctx.beginPath();ctx.arc(-11,7,2.6,0,6.3);ctx.arc(11,7,2.6,0,6.3);ctx.fill();
ctx.restore()}
function draw(dt){
drawScene(state=='play'?dt:dt*.5);
if(!blob){blob={x:W/2,y:H/2,r:40,wob:0,vx:0,vy:0}}
puddles.forEach(drawPuddle);bits.forEach(drawBit);if(pink)drawPink();if(pw)drawPower2();
zaps.forEach(drawEnemy);shots.forEach(drawShot);puffs.forEach(drawPuff);
if(god>0&&state=='play')drawAura();if(state=='play')drawFx();drawBlob();
if(state=='play'){drawBars();drawLevelUI()}popups.forEach(function(p){ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.font='700 22px '+FONT;ctx.textAlign='center';ctx.fillText(p.s,p.x,p.y);ctx.globalAlpha=1})}
function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.6);ctx.bezierCurveTo(x-s*1.2,y-s*.1,x-s*.5,y-s*1.1,x,y-s*.35);ctx.bezierCurveTo(x+s*.5,y-s*1.1,x+s*1.2,y-s*.1,x,y+s*.6);ctx.closePath()}
function getMood(){
if(state=='over')return 'dizzy';if(state=='menu')return 'happy';if(god>0)return 'star';if(big>0)return 'tongue';
if(hurt>.5)return 'ouch';if(eat>0)return eatKind;
for(var i=0;i<zaps.length;i++)if(dist(zaps[i],blob)<blob.r+zaps[i].r+110)return 'scared';
for(var j=0;j<bits.length;j++)if(dist(bits[j],blob)<blob.r*2.6+30)return 'wow';
return 'neutral'}
function face(R,ex,ey,m){
var dk='#3a2146',blink=blinkT<0&&(m=='neutral'||m=='wow'),mx=ex*1.5,my=R*.22+ey*1.5,w=R*.09,i;
var glad=(m=='happy'||m=='heart'||m=='cat'||m=='tongue'||m=='wink'||m=='star');
ctx.fillStyle='rgba(255,100,140,'+(glad?.75:.5)+')';
[-1,1].forEach(function(s){ctx.beginPath();ctx.ellipse(s*R*.55+ex,R*.2+ey,R*.17,R*.1,0,0,6.3);ctx.fill()});
ctx.strokeStyle=dk;ctx.lineWidth=Math.max(1.6,R*.05);ctx.lineCap='round';ctx.lineJoin='round';
[-1,1].forEach(function(s){var x=s*R*.3+ex*1.5,y=-R*.05+ey*1.5,k=m;
if(m=='wink')k=(s==-1)?'happy':'neutral';
if(k=='happy'||k=='cat'||k=='tongue'){ctx.beginPath();ctx.arc(x,y+R*.07,R*.12,3.4,6.0);ctx.stroke()}
else if(k=='ouch'){ctx.beginPath();ctx.moveTo(x+s*R*.12,y-R*.13);ctx.lineTo(x-s*R*.1,y);ctx.lineTo(x+s*R*.12,y+R*.13);ctx.stroke()}
else if(k=='dizzy'){ctx.beginPath();for(var a=0;a<=14;a+=.4){var rr=a/14*R*.16;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.stroke()}
else if(k=='star'){ctx.fillStyle='#ffc83a';star(x,y,R*.24,1);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-R*.04,y-R*.04,R*.04,0,6.3);ctx.fill()}
else if(k=='heart'){ctx.fillStyle='#ff4f6d';heart(x,y,R*.2);ctx.fill()}
else if(k=='scared'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,R*.17,0,6.3);ctx.fill();ctx.stroke();ctx.fillStyle=dk;ctx.beginPath();ctx.arc(x+ex*.5,y,R*.04,0,6.3);ctx.fill()}
else if(blink&&k!='happy'){ctx.beginPath();ctx.moveTo(x-R*.1,y);ctx.lineTo(x+R*.1,y);ctx.stroke()}
else{var big=k=='wow'?1.25:1;ctx.fillStyle=dk;ctx.beginPath();ctx.ellipse(x,y,R*.14*big,R*.19*big,0,0,6.3);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-R*.04,y-R*.07,R*.06*big,0,6.3);ctx.arc(x+R*.04,y+R*.06,R*.03*big,0,6.3);if(k=='wow')ctx.arc(x+R*.07,y-R*.02,R*.025,0,6.3);ctx.fill()}
});
ctx.fillStyle=dk;
if(m=='happy'||m=='star'||m=='heart'||m=='wink'){ctx.beginPath();ctx.arc(mx,my-R*.02,R*.13,0,Math.PI);ctx.closePath();ctx.fill();ctx.fillStyle='#ff7fa6';ctx.beginPath();ctx.ellipse(mx,my+R*.09,R*.06,R*.035,0,0,6.3);ctx.fill()}
else if(m=='cat'){ctx.beginPath();ctx.arc(mx-w*.9,my,w*.9,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(mx+w*.9,my,w*.9,0,Math.PI);ctx.stroke()}
else if(m=='ouch'||m=='wow'){ctx.beginPath();ctx.ellipse(mx,my+R*.06,m=='wow'?R*.07:R*.1,m=='wow'?R*.1:R*.12,0,0,6.3);ctx.fill()}
else if(m=='scared'||m=='dizzy'){ctx.beginPath();for(i=0;i<=6;i++)ctx.lineTo(mx-w*2.2+i*w*.73,my+R*.06+(i%2?-1:1)*R*.03);ctx.stroke()}
else{ctx.beginPath();ctx.moveTo(mx-w*2,my);ctx.quadraticCurveTo(mx-w,my+w*1.4,mx,my);ctx.quadraticCurveTo(mx+w,my+w*1.4,mx+w*2,my);ctx.stroke();
if(m=='tongue'){ctx.fillStyle='#ff7fa6';ctx.beginPath();ctx.ellipse(mx+w*.7,my+w*1.3,R*.05,R*.07,0,0,6.3);ctx.fill()}}
if(m=='scared'){ctx.fillStyle='#8fd3ff';ctx.beginPath();ctx.moveTo(R*.62,-R*.62);ctx.quadraticCurveTo(R*.85,-R*.3,R*.62,-R*.25);ctx.quadraticCurveTo(R*.39,-R*.3,R*.62,-R*.62);ctx.fill()}
}
function drawBlob(){
if(state=='menu'){blob.x=W/2;blob.y=H*.78;blob.wob+=.05}
var sp=Math.hypot(blob.vx,blob.vy),stretch=1+Math.min(sp/500,.25),ang=Math.atan2(blob.vy,blob.vx);
var fk=Math.max(hurt,grace);if(fk>0&&Math.floor(fk*14)%2)ctx.globalAlpha=.4;
ctx.save();ctx.translate(blob.x,blob.y);ctx.rotate(ang);ctx.scale(stretch,1/stretch);
ctx.beginPath();for(var i=0;i<=40;i++){var a=i/40*6.2832,r=blob.r*(1+.05*Math.sin(a*3+blob.wob)+.03*Math.sin(a*5-blob.wob*1.3));
var x=Math.cos(a)*r,y=Math.sin(a)*r*(Math.sin(a)>0?.88:1);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
ctx.closePath();var gr=ctx.createRadialGradient(-blob.r*.3,-blob.r*.3,blob.r*.1,0,0,blob.r);
gr.addColorStop(0,v('--blob2'));gr.addColorStop(1,v('--blob'));ctx.fillStyle=gr;ctx.fill();
ctx.lineWidth=Math.max(2,blob.r*.07);ctx.strokeStyle='#ff7fa6';ctx.stroke();ctx.restore();
ctx.save();ctx.translate(blob.x,blob.y);face(blob.r,Math.cos(ang)*blob.r*.1,Math.sin(ang)*blob.r*.1,getMood());
var LR=blob.r;ctx.fillStyle='#7fcf8f';ctx.beginPath();ctx.ellipse(0,-LR*.95,LR*.28,LR*.13,-.5,0,6.3);ctx.fill();ctx.strokeStyle='#4fae6a';ctx.lineWidth=1.5;ctx.stroke();
ctx.restore();ctx.globalAlpha=1}
requestAnimationFrame(loop);
})();
